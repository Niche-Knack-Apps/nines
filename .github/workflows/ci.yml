name: ci

# Pull requests run this directly; pushes to main run it through release.yml.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: VERSION matches rust/Cargo.toml
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          c=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          [ "$v" = "$c" ] || { echo "VERSION $v != rust/Cargo.toml $c"; exit 1; }
      - name: pull request bumps VERSION
        if: github.event_name == 'pull_request'
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is already released; bump VERSION (and rust/Cargo.toml) so this merge ships."
            exit 1
          fi
